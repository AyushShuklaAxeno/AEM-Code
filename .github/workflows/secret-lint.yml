name: AEM Secret & API Key Scanner

on:
  push:
  pull_request:

jobs:
  secret-rules:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout AEM repository
        uses: actions/checkout@v4

      - name: Run Gitleaks for AEM
        run: |
          # Create temporary AEM-aware allowlist in runner memory (no extra file in repo)
          cat << 'EOF' > /tmp/gitleaks.toml
          [extend]
          useDefault = true

          [allowlist]
          description = "AEM Cloud Manager placeholders, lockfiles, and build folders"
          paths = [
            '''(^|/)(node_modules|dist|build|target|node|\.cloudmanager)/''',
            '''package-lock\.json$''',
            '''yarn\.lock$'''
          ]
          regexTarget = "line"
          regexes = [
            # Ignore Adobe Cloud Manager secret and env variables ($[secret:...] / $[env:...])
            '''\$\[(secret|env):[^\]]+\]''',
            # Ignore standard JCR UUID properties in AEM .content.xml files
            '''jcr:uuid\s*=\s*"[^"]+"'''
          ]
          EOF

          # Download and run the free MIT-licensed Gitleaks binary
          GITLEAKS_VERSION="8.30.1"
          wget -q https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz -O /tmp/gitleaks.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          chmod +x /tmp/gitleaks

          # Scan the entire AEM project directory
          /tmp/gitleaks dir . --config /tmp/gitleaks.toml --verbose --redact