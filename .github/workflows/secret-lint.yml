name: Secret & API Key rules

on:
  push:
  pull_request:

jobs:
  secret-rules:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        rule: [no-frontend-api-keys, no-hardcoded-tokens]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Check rule "${{ matrix.rule }}"
        shell: python
        env:
          RULE: ${{ matrix.rule }}
        run: |
          import os, sys, pathlib, re

          # Skip build output, dependencies, and internal tool folders
          SKIP = {
              "node_modules", ".git", "dist", "build", "_site", "vendor",
              "target", "node", ".cloudmanager"
          }

          rule = os.environ["RULE"]

          # Patterns to detect dangerous hardcoded secrets
          PATTERNS = {
              "no-frontend-api-keys": [
                  # Variable or property assignment with potential secret in JS/TS/HTML
                  (re.compile(r"""(?i)(api[_-]?key|client[_-]?secret|auth[_-]?token|app[_-]?id)\s*[:=]\s*['"][a-zA-Z0-9_\-\.]{12,}['"]"""),
                   "Hardcoded API key or secret token detected in client-side code. Manage secrets via server-side OSGi config."),
                  # Static HTML data-api-key attribute with literal value
                  (re.compile(r"""data-api-key\s*=\s*['"][a-zA-Z0-9_\-\.]{12,}['"]"""),
                   "Hardcoded 'data-api-key' found in HTML. API keys must not be exposed to the browser."),
                  # 32-character hexadecimal key literal in frontend code (e.g. OpenWeatherMap keys)
                  (re.compile(r"""['"][a-fA-F0-9]{32}['"]"""),
                   "Suspicious 32-character hex API key literal found in client-side code."),
              ],
              "no-hardcoded-tokens": [
                  # AWS Access Key ID
                  (re.compile(r"""AKIA[0-9A-Z]{16}"""),
                   "AWS Access Key ID detected."),
                  # Google API Key
                  (re.compile(r"""AIza[0-9A-Za-z\-_]{35}"""),
                   "Google API Key detected."),
                  # Private key header
                  (re.compile(r"""-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----"""),
                   "Private encryption key detected."),
                  # GitHub personal access token
                  (re.compile(r"""ghp_[a-zA-Z0-9]{36}"""),
                   "GitHub Personal Access Token detected."),
              ],
          }

          # Target file extensions by rule
          EXTENSIONS = {
              "no-frontend-api-keys": [".js", ".ts", ".jsx", ".tsx", ".html"],
              "no-hardcoded-tokens": [".js", ".ts", ".html", ".java", ".xml", ".json", ".yml", ".yaml"],
          }

          rules_to_run = PATTERNS[rule]
          target_extensions = tuple(EXTENSIONS[rule])

          found = 0

          for path in pathlib.Path(".").rglob("*"):
              if not path.is_file():
                  continue
              if SKIP & set(path.parts):
                  continue
              if not path.name.lower().endswith(target_extensions):
                  continue

              try:
                  content = path.read_text(encoding="utf-8", errors="ignore")
              except Exception as err:
                  print(f"::warning file={path.as_posix()}::Could not read file: {err}")
                  continue

              for line_number, line_text in enumerate(content.splitlines(), start=1):
                  stripped = line_text.strip()
                  # Skip comments in JS/TS/HTML
                  if stripped.startswith("//") or stripped.startswith("/*") or stripped.startswith("*") or stripped.startswith("<!--"):
                      continue
                  # Skip Cloud Manager secret/env placeholders (e.g., $[secret:...])
                  if "$[secret:" in line_text or "$[env:" in line_text:
                      continue

                  for pattern, error_msg in rules_to_run:
                      if pattern.search(line_text):
                          print(f"::error file={path.as_posix()},line={line_number}::{error_msg}")
                          found += 1

          if found:
              print(f"\nFound {found} violation(s) of rule '{rule}'.")
              sys.exit(1)

          print(f"Rule '{rule}': all good.")

